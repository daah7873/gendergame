<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비밀 숫자 연산 퍼즐</title>
<style>
  body { font-family: 'Malgun Gothic', sans-serif; background-color: #f0f2f5; padding: 20px; display: flex; justify-content: center; }
  .container { background-color: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 550px; width: 100%; text-align: center; }
  h1 { color: #2563eb; margin-bottom: 5px; }
  .subtitle { color: #64748b; font-size: 0.95rem; margin-bottom: 20px; }
  #intro-screen { display: block; }
  .name-input { padding: 12px; font-size: 1.2rem; border: 2px solid #94a3b8; border-radius: 6px; width: 60%; margin-bottom: 15px; text-align: center; }
  .start-btn { width: 65%; padding: 15px; background: #22c55e; color: white; border: none; border-radius: 8px; font-size: 1.3rem; font-weight: bold; cursor: pointer; }
  #game-screen { display: none; }
  .header-info { display: flex; justify-content: space-between; align-items: center; background: #1e293b; color: white; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-weight: bold; }
  .stage-info { font-size: 1.2rem; background: #3b82f6; padding: 5px 15px; border-radius: 20px; }
  .timer { font-size: 1.5rem; color: #facc15; font-variant-numeric: tabular-nums; }
  .question-box { background: #f8fafc; border: 2px dashed #94a3b8; padding: 20px; margin: 15px 0; border-radius: 8px; font-size: 1.2rem; font-weight: bold; color: #334155; word-break: keep-all; }
  .badge { display: inline-block; background: #dbeafe; color: #1e3a8a; padding: 10px 15px; margin: 5px; border-radius: 8px; font-size: 1.3rem; font-weight: bold; }
  .input-area { display: flex; gap: 10px; margin-top: 15px; }
  input[type="text"].formula-input { flex-grow: 1; padding: 12px; font-size: 1.2rem; border: 2px solid #cbd5e1; border-radius: 6px; }
  button.submit { width: 80px; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 1.1rem; }
  #message { margin-top: 15px; padding: 15px; border-radius: 6px; font-weight: bold; display: none; line-height: 1.4; }
  .success { background: #dcfce7; color: #166534; }
  .error { background: #fee2e2; color: #991b1b; }
  #finish-screen { display: none; margin-top: 30px; }
  .finish-title { font-size: 2rem; color: #ea580c; margin-bottom: 10px; }
</style>
</head>
<body>

<div class="container">
  <h1>비밀 숫자 퍼즐</h1>
  <p class="subtitle">3문제를 가장 빨리 푸는 사람은 누구?</p>

  <div id="intro-screen">
    <br><br>
    <input type="text" id="studentName" class="name-input" placeholder="이름을 입력하세요"><br>
    <button class="start-btn" onclick="startGame()">게임 시작하기!</button>
  </div>

  <div id="game-screen">
    <div class="header-info">
      <div class="stage-info" id="stageDisplay">1 / 3 문제</div>
      <div class="timer" id="timerDisplay">00:00</div>
    </div>
    
    <div class="question-box" id="question-text">문제 내용</div>

    <h3 style="text-align: left; margin-bottom: 5px; font-size:1rem; color:#64748b;">사용 가능한 숫자 (최대 1번씩)</h3>
    <div id="pool">
      <div class="badge">2</div><div class="badge">3</div><div class="badge">4</div>
      <div class="badge">5</div><div class="badge">8</div><div class="badge">10</div>
    </div>

    <div class="input-area">
      <input type="text" id="formula" class="formula-input" placeholder="수식 입력 (예: (10*5)/2)" onkeypress="if(event.key === 'Enter') check()">
      <button class="submit" onclick="check()">확인</button>
    </div>
    <div id="message"></div>
  </div>

  <div id="finish-screen">
    <div class="finish-title">🎉 미션 클리어! 🎉</div>
    <p style="font-size: 1.2rem; font-weight: bold;" id="final-record"></p>
    <p style="color: #2563eb; font-weight: bold; margin-top:20px;">
      ✅ 기록이 성공적으로 전송되었습니다!<br>수고하셨습니다!
    </p>
  </div>
</div>

<script>
  // ⭐️ 선생님의 진짜 주소를 따옴표 안에 넣어주세요! ⭐️
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxYpofi4nR1GGrW4NPW51Srbd_6N1Lc3w-uFPeepoYw8mXtXwxL_SDrBz2qEpezK2Ie/exec";
  
  const quizData = [
    { 
      text: `
        <div style="margin-bottom: 10px;">[2010년~2015년 남성 근로자 월평균 임금]</div>
        <table style="width: 100%; border-collapse: collapse; margin-bottom: 15px; text-align: center; font-size: 1.1rem; background: white;">
          <tr style="background: #e2e8f0;">
            <th style="border: 1px solid #94a3b8; padding: 8px;">연도</th>
            <th style="border: 1px solid #94a3b8; padding: 8px;">남성 근로자 월평균 임금</th>
          </tr>
          <tr>
            <td style="border: 1px solid #94a3b8; padding: 8px;">2010년</td>
            <td style="border: 1px solid #94a3b8; padding: 8px; color: #2563eb; font-weight: bold;">1,200 달러</td>
          </tr>
          <tr>
            <td style="border: 1px solid #94a3b8; padding: 8px;">2015년</td>
            <td style="border: 1px solid #94a3b8; padding: 8px; color: #ef4444; font-weight: bold;">1,500 달러</td>
          </tr>
        </table>
        2010년 대비 2015년의 <b>남성 근로자 월평균 임금 상승률</b>은 몇 %인가?
      `, 
      answer: 25 
    },
    { 
      text: `
        t년에 다음과 같은 식이 성립한다고 할 때,<br><br>
        <div style="display: flex; align-items: center; justify-content: center; font-size: 1.2rem; margin: 15px 0;">
          <div style="text-align: center;">
            <span style="border-bottom: 2px solid #334155; padding-bottom: 4px; display: block;">(남성 정규직 임금 - 여성 정규직 임금)</span>
            <span style="padding-top: 4px; display: block;">남성 정규직 임금</span>
          </div>
          <span style="margin-left: 10px;">× 100 = <b>20</b></span>
        </div><br>
        여성 정규직 근로자 평균 임금은 남성 정규직 근로자 평균 임금의 몇 %인가?
      `, 
      answer: 80 
    },
    { 
      text: `
        <div style="margin-bottom: 10px;">[갑국의 t+10년 임금 지수]</div>
        <table style="width: 100%; border-collapse: collapse; margin-bottom: 15px; text-align: center; font-size: 1.1rem; background: white;">
          <tr style="background: #e2e8f0;">
            <th style="border: 1px solid #94a3b8; padding: 8px;">성별</th>
            <th style="border: 1px solid #94a3b8; padding: 8px;">남성</th>
            <th style="border: 1px solid #94a3b8; padding: 8px;">여성</th>
          </tr>
          <tr>
            <td style="border: 1px solid #94a3b8; padding: 8px; font-weight: bold;">임금 수준</td>
            <td style="border: 1px solid #94a3b8; padding: 8px;">100</td>
            <td style="border: 1px solid #94a3b8; padding: 8px;">80</td>
          </tr>
        </table>
        t+10년 남성의 임금이 <b>120만 원</b>일 때, 여성의 임금은 몇 만 원인가?
      `, 
      answer: 96 
    }
  ];

  const numbers = [2, 3, 4, 5, 8, 10];
  
  let currentStage = 0;
  let timerInterval = null;
  let secondsElapsed = 0;
  let studentName = "";

  function startGame() {
    studentName = document.getElementById('studentName').value.trim();
    if (!studentName) {
      alert("이름을 꼭 입력해주세요!");
      return;
    }
    document.getElementById('intro-screen').style.display = 'none';
    document.getElementById('game-screen').style.display = 'block';
    loadStage();
    timerInterval = setInterval(() => {
      secondsElapsed++;
      const m = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
      const s = (secondsElapsed % 60).toString().padStart(2, '0');
      document.getElementById('timerDisplay').textContent = `${m}:${s}`;
    }, 1000);
  }

  function loadStage() {
    document.getElementById('stageDisplay').textContent = `${currentStage + 1} / ${quizData.length} 문제`;
    document.getElementById('question-text').textContent = quizData[currentStage].text;
    document.getElementById('formula').value = '';
    document.getElementById('message').style.display = 'none';
  }

  function check() {
    const input = document.getElementById('formula').value.trim();
    const msg = document.getElementById('message');
    msg.style.display = 'block';
    const currentAnswer = quizData[currentStage].answer;

    if (!input) return showMsg("수식을 입력해주세요.", "error");
    if (/[^0-9+\-*/().\s]/.test(input)) return showMsg("숫자와 연산 기호만 사용하세요.", "error");

    const used = input.match(/\d+/g);
    if (!used) return showMsg("숫자를 입력하세요.", "error");

    let pool = [...numbers];
    for (let n of used) {
      let idx = pool.indexOf(parseInt(n, 10));
      if (idx === -1) return showMsg(`허용되지 않은 숫자(${n})를 썼거나 중복 사용했습니다.`, "error");
      pool.splice(idx, 1);
    }

    try {
      const result = new Function('return ' + input)();
      if (result === currentAnswer) {
        showMsg("정답입니다! 다음 문제로 넘어갑니다.", "success");
        setTimeout(() => {
          currentStage++;
          if (currentStage >= quizData.length) {
            finishGame();
          } else {
            loadStage(); 
          }
        }, 1200);
      } else {
        showMsg(`계산 결과는 [ ${result} ] 입니다.\n문제의 진짜 정답을 다시 생각해보세요!`, "error");
      }
    } catch (e) {
      showMsg("수식이 잘못되었습니다. 괄호나 기호를 확인하세요.", "error");
    }
  }

  // ⭐️ 백그라운드 스텔스 전송 (화면 멈춤, 에러 완벽 해결) ⭐️
  function finishGame() {
    // 타이머 멈추고 게임 종료 화면 바로 띄우기!
    clearInterval(timerInterval);
    document.getElementById('game-screen').style.display = 'none';
    document.getElementById('finish-screen').style.display = 'block';
    
    const m = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
    const s = (secondsElapsed % 60).toString().padStart(2, '0');
    const timeString = `${m}분 ${s}초`;
    
    document.getElementById('final-record').textContent = `[ ${studentName} ] 학생의 최종 기록: ${timeString}`;
    
    // 주소 조립
    const sendUrl = `${WEB_APP_URL}?name=${encodeURIComponent(studentName)}&time=${encodeURIComponent(timeString)}&seconds=${secondsElapsed}`;
    
    // 화면 전환 없이 데이터만 뒤로 조용히 쏘기! (no-cors 모드)
    fetch(sendUrl, { mode: 'no-cors' })
      .then(function() {
        console.log("엑셀 전송 완료!");
      })
      .catch(function(err) {
        console.log("엑셀 전송 중 문제 발생:", err);
      });
  }

  function showMsg(text, type) {
    const msg = document.getElementById('message');
    msg.innerText = text;
    msg.className = type;
  }
</script>
</body>
</html>
